<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DienstRechner">
<meta name="theme-color" content="#ffffff">
<title>DienstRechner 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0FBFA8;--teal-d:#0a9e8a;--teal-l:#e6faf8;
  --purple:#7B61FF;--purple-d:#5b44d9;--purple-l:#f0edff;
  --ink:#0e1117;--muted:#6b7280;--faint:#9ca3af;
  --bg:#fff;--cream:#fafafa;--cream2:#f5f5f5;
  --border:#e5e7eb;
  --grad:linear-gradient(100deg,var(--teal),var(--purple));
  --grad-s:linear-gradient(135deg,#e6faf8,#f0edff);
  --sh:0 1px 4px rgba(0,0,0,.06);
  --sh2:0 4px 16px rgba(0,0,0,.08);
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
.topbar{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;}
.app-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.1rem;font-weight:800;color:var(--ink);}
.app-title em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.app-sub{font-size:0.65rem;color:var(--faint);margin-top:1px;}
.year-total-pill{background:var(--grad);border-radius:99px;padding:7px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(123,97,255,.25);}
.year-total-pill span:first-child{font-size:0.6rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.5px;}
.year-total-pill span:last-child{font-family:'Plus Jakarta Sans',sans-serif;font-size:0.95rem;font-weight:700;color:#fff;}
.main{max-width:1080px;margin:0 auto;padding:20px 16px 80px;}
.params{background:var(--cream);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;}
.params-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.ppill{display:flex;align-items:center;gap:7px;background:var(--bg);border:1.5px solid var(--border);border-radius:99px;padding:5px 13px;transition:border-color .15s;}
.ppill:focus-within{border-color:var(--purple);}
.ppill label{font-size:0.62rem;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.ppill select,.ppill input{background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.78rem;font-weight:600;color:var(--ink);cursor:pointer;padding:0;}
.ppill input{width:84px;text-align:right;}
.pp-blue{background:var(--purple-l);border-color:rgba(123,97,255,.2);}
.pp-blue .sv{font-size:0.78rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.month-nav{display:flex;align-items:center;gap:7px;margin-bottom:16px;}
.nav-btn{width:30px;height:30px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);color:var(--muted);font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.nav-btn:hover{background:var(--grad);color:#fff;border-color:transparent;}
.month-pills{display:flex;gap:3px;flex-wrap:wrap;flex:1;}
.mpill{font-size:0.7rem;font-weight:500;padding:4px 10px;border-radius:99px;background:transparent;border:1.5px solid transparent;color:var(--faint);cursor:pointer;transition:all .13s;white-space:nowrap;}
.mpill:hover{background:var(--cream2);color:var(--muted);}
.mpill.active{background:var(--grad);color:#fff;font-weight:600;}
.mpill.has-d{background:var(--purple-l);color:var(--purple-d);border-color:rgba(123,97,255,.2);}
.cal-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--sh2);}
.cal-header{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--grad-s);display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.cal-month-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.25rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.cal-stats{display:flex;gap:14px;flex-wrap:wrap;}
.cal-stat{font-size:0.7rem;color:var(--muted);}
.cal-stat span{font-weight:600;color:var(--purple-d);}
.days-header{display:grid;grid-template-columns:repeat(7,1fr);padding:7px 10px 4px;background:var(--cream);}
.dh{text-align:center;font-size:0.58rem;font-weight:600;color:var(--faint);padding:2px;text-transform:uppercase;letter-spacing:.4px;}
.dh.we{color:var(--purple);}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:5px 8px 10px;}
.dc{background:var(--cream);border-radius:var(--rs);padding:5px;min-height:68px;display:flex;flex-direction:column;gap:2px;border:1.5px solid transparent;transition:all .12s;}
.dc.empty{background:transparent;border:none;}
.dc.we{background:#fdf4ff;}
.dc.hol{background:var(--grad-s);border-color:rgba(123,97,255,.18);}
.dc.khalf{background:var(--teal-l);border-color:rgba(15,191,168,.18);}
.dc.has-sel{border-color:var(--purple)!important;box-shadow:0 0 0 2px rgba(123,97,255,.1);}
.dnum{font-size:0.7rem;font-weight:600;color:var(--muted);line-height:1;}
.dc.we .dnum{color:var(--purple);}
.dc.hol .dnum{color:var(--purple-d);font-weight:700;}
.dc.khalf .dnum{color:var(--teal-d);font-weight:700;}
.dhol-name{font-size:0.4rem;color:var(--faint);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.dbtns{display:flex;flex-direction:column;gap:2px;flex:1;justify-content:flex-end;}
.dbtn{font-size:0.58rem;font-weight:500;padding:3px 4px;border-radius:5px;border:1.5px solid transparent;cursor:pointer;text-align:center;line-height:1.3;transition:all .12s;opacity:.4;}
.dbtn:hover{opacity:.75;transform:translateY(-1px);}
.dbtn.active{opacity:1;transform:none;}
.dbtn-full{background:rgba(123,97,255,.08);color:var(--purple-d);border-color:rgba(123,97,255,.18);}
.dbtn-full.active{background:var(--grad);color:#fff;border-color:transparent;}
.dbtn-tag{background:rgba(15,191,168,.08);color:var(--teal-d);border-color:rgba(15,191,168,.18);}
.dbtn-tag.active{background:var(--teal);color:#fff;border-color:transparent;}
.dbtn-nacht{background:rgba(123,97,255,.1);color:var(--purple-d);border-color:rgba(123,97,255,.2);}
.dbtn-nacht.active{background:var(--purple);color:#fff;border-color:transparent;}
.dbtn-tag-35{background:rgba(15,191,168,.06);color:var(--teal-d);border-color:rgba(15,191,168,.12);}
.dbtn-tag-35.active{background:var(--teal-d);color:#fff;border-color:transparent;}
.dbtn-nacht-35{background:rgba(123,97,255,.06);color:var(--purple);border-color:rgba(123,97,255,.12);}
.dbtn-nacht-35.active{background:var(--purple-d);color:#fff;border-color:transparent;}
.summary-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh2);}
.sum-header{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--grad-s);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.sum-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:0.95rem;font-weight:800;color:var(--ink);}
.sum-totals{display:flex;gap:14px;flex-wrap:wrap;}
.sum-kpi-l{font-size:0.6rem;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;font-weight:500;}
.sum-kpi-v{font-family:'Plus Jakarta Sans',sans-serif;font-size:1rem;font-weight:700;color:var(--purple-d);}
.sum-kpi-v.hi{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.1rem;}
.sum-body{padding:12px 16px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.stbl{width:100%;border-collapse:collapse;font-size:0.71rem;min-width:560px;}
.stbl th{text-align:left;padding:5px 7px;font-size:0.58rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);}
.stbl th.r{text-align:right;}
.stbl td{padding:7px 7px;border-bottom:1px solid var(--border);color:var(--muted);}
.stbl td.r{text-align:right;font-variant-numeric:tabular-nums;}
.stbl tr:hover td{background:var(--cream);}
.stbl .strong{color:var(--ink);font-weight:600;}
.stbl .tfoot td{border-top:2px solid var(--border);background:var(--grad-s);font-weight:700;font-size:0.78rem;color:var(--purple-d);padding:9px 7px;}
.stbl .dash{color:var(--border);}
.type-pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:0.62rem;font-weight:600;white-space:nowrap;}
.tp-wd{background:var(--purple-l);color:var(--purple-d);}
.tp-fr{background:var(--teal-l);color:var(--teal-d);}
.tp-sa{background:var(--teal-l);color:var(--teal-d);}
.tp-so{background:var(--purple-l);color:var(--purple-d);}
.tp-fei{background:var(--grad-s);color:var(--purple-d);}
.tp-n{background:rgba(123,97,255,.1);color:var(--purple-d);}
.tp-x{background:var(--teal-l);color:var(--teal-d);}
.pay-note{margin-top:10px;padding:8px 12px;background:var(--teal-l);border:1px solid rgba(15,191,168,.2);border-radius:var(--rs);font-size:0.69rem;color:var(--teal-d);font-weight:500;}
.empty-state{text-align:center;padding:48px 20px;color:var(--faint);}
.empty-state .ei{font-size:2rem;margin-bottom:8px;opacity:.3;}
.empty-state p{font-size:0.8rem;color:var(--muted);}
@media(max-width:600px){
  .main{padding:14px 10px 70px;}
  .topbar{padding:0 14px;}
  .app-title{font-size:0.95rem;}
  .year-total-pill{padding:6px 12px;}
  .cal-month-name{font-size:1.05rem;}
  .days-grid{padding:4px 5px 8px;gap:2px;}
  .dc{min-height:64px;padding:5px 3px;}
  .dnum{font-size:0.65rem;}
  .dbtn{font-size:0.6rem;padding:4px 3px;line-height:1.4;}
  .sum-body{padding:8px 8px 14px;}
  .stbl{font-size:0.63rem;min-width:470px;}
  .stbl th{padding:4px 5px;font-size:0.52rem;}
  .stbl td{padding:6px 5px;}
  .mpill{font-size:0.63rem;padding:4px 8px;}
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--cream);}
::-webkit-scrollbar-thumb{background:rgba(123,97,255,.25);border-radius:2px;}
</style>
</head>
