<title>DienstRechner 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#f5f5f7;--sf:#fff;--s2:#f5f5f7;--bd:#d8d8de;--bl:#ebebef;
  --tx:#1d1d1f;--t2:#3a3a3c;--mu:#86868b;
  --blue:#0071e3;--blue-d:#0058b0;--blue-l:#e8f2fd;
  --green:#30a14e;--green-l:#eaf6ec;
  --purple:#6e3ff3;--purple-l:#f1ecfe;
  --orange:#ff6b00;--orange-l:#fff3e8;
  --teal:#0077b6;--teal-l:#e5f3fa;
  --yellow:#b07800;--yellow-l:#fdf7e3;
  --red:#cc3333;--red-l:#fff0ef;
  --sh:0 1px 4px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 8px 24px rgba(0,0,0,.09);
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:'Figtree',-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ── TOP BAR ── */
.topbar{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bl);position:sticky;top:0;z-index:100;padding:14px 32px;}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.app-title{font-size:1.25rem;font-weight:700;letter-spacing:-.3px;}
.app-title em{font-style:normal;color:var(--blue);}
.app-sub{font-size:0.72rem;color:var(--mu);margin-top:1px;}
.year-total-pill{background:var(--blue);color:#fff;border-radius:24px;padding:8px 20px;font-size:0.82rem;font-weight:600;white-space:nowrap;}
.year-total-pill span{opacity:.75;font-weight:400;font-size:0.72rem;margin-right:6px;}

/* ── MAIN LAYOUT ── */
.main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}

/* ── PARAMS ── */
.params{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:18px 22px;margin-bottom:22px;}
.params-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.ppill{display:flex;align-items:center;gap:9px;background:var(--s2);border:1px solid var(--bd);border-radius:30px;padding:7px 16px;transition:border-color .15s;}
.ppill:focus-within{border-color:var(--blue);}
.ppill label{font-size:0.72rem;color:var(--mu);font-weight:500;white-space:nowrap;}
.ppill select,.ppill input{background:transparent;border:none;outline:none;font-family:'Figtree',sans-serif;font-size:0.82rem;font-weight:600;color:var(--tx);cursor:pointer;padding:0;}
.ppill input{width:90px;text-align:right;}
.pp-blue{background:var(--blue-l);border-color:#b8d4f5;}
.pp-blue .sv{color:var(--blue);font-size:0.82rem;font-weight:600;}
.pp-green{background:var(--green-l);border-color:#b0ddb8;}
.pp-green .sv{color:var(--green);font-size:0.82rem;font-weight:600;}

/* ── NOTICE ── */
.notice{background:var(--yellow-l);border:1px solid #e0c060;border-radius:var(--r);padding:13px 18px;margin-bottom:22px;font-size:0.78rem;line-height:1.8;color:#5a4000;}
.notice b{color:#8a5e00;}
details summary{cursor:pointer;font-weight:600;font-size:0.8rem;color:#8a5e00;list-style:none;display:flex;align-items:center;gap:6px;}
details summary::before{content:'▶';font-size:0.6rem;transition:transform .2s;}
details[open] summary::before{transform:rotate(90deg);}
details .notice-body{margin-top:10px;padding-top:10px;border-top:1px solid #e0c06050;}

/* ── MONTH NAVIGATOR ── */
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.nav-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);transition:all .15s;flex-shrink:0;}
.nav-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.month-pills{display:flex;gap:5px;flex-wrap:wrap;flex:1;}
.mpill{font-size:0.75rem;font-weight:600;padding:6px 14px;border-radius:22px;border:1px solid transparent;background:var(--s2);color:var(--mu);cursor:pointer;transition:all .15s;white-space:nowrap;}
.mpill:hover{background:var(--bl);color:var(--t2);}
.mpill.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,113,227,.3);}
.mpill.has-dienst:not(.active){background:var(--blue-l);color:var(--blue);border-color:#c0d8f5;}

/* ── CALENDAR CARD ── */
.cal-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);overflow:hidden;margin-bottom:24px;}
.cal-header{padding:18px 22px 14px;border-bottom:1px solid var(--bl);display:flex;align-items:baseline;justify-content:space-between;}
.cal-month-name{font-size:1.4rem;font-weight:700;letter-spacing:-.3px;}
.cal-stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.cal-stat{font-size:0.74rem;color:var(--mu);}
.cal-stat span{color:var(--blue);font-weight:600;}

/* ── LEGEND inside card ── */
.cal-legend{padding:10px 22px;background:var(--s2);border-bottom:1px solid var(--bl);display:flex;gap:12px;flex-wrap:wrap;}
.ll{display:flex;align-items:center;gap:5px;font-size:0.68rem;color:var(--mu);}
.ldot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

/* ── DAYS GRID ── */
.days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:10px 14px 6px;}
.dh{text-align:center;font-size:0.72rem;font-weight:600;color:var(--mu);padding:4px;}
.dh.we{color:var(--red);}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 14px 14px;}

.dc{background:var(--s2);border-radius:10px;padding:6px;min-height:72px;display:flex;flex-direction:column;gap:3px;border:2px solid transparent;transition:border-color .12s,background .12s;}
.dc.empty{background:transparent;border:none;}
.dc.we{background:#fff5f5;}
.dc.hol{background:var(--purple-l);border-color:#d0bef8;}
.dc.fri{background:#f3fbf6;}
.dc.kars{background:var(--yellow-l);border-color:#e8d080;}
.dc.khalf{background:var(--teal-l);border-color:#aad4e8;}
.dc.has-sel{border-color:var(--blue)!important;box-shadow:0 0 0 3px rgba(0,113,227,.12);}

.dnum{font-size:0.82rem;font-weight:600;color:var(--t2);line-height:1;}
.dhol-name{font-size:0.42rem;color:var(--mu);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.dc.we .dnum{color:var(--red);}
.dc.hol .dnum{color:var(--purple);}
.dc.khalf .dnum{color:var(--teal);}
.dc.kars .dnum{color:var(--yellow);}
.dtag{font-size:0.6rem;font-weight:600;color:var(--mu);margin-top:1px;}

.dbtns{display:flex;flex-direction:column;gap:3px;flex:1;justify-content:flex-end;}
.dbtn{font-size:0.7rem;font-weight:600;padding:4px 6px;border-radius:7px;border:1.5px solid transparent;cursor:pointer;font-family:'Figtree',sans-serif;text-align:center;line-height:1.3;transition:all .13s;opacity:0.55;white-space:nowrap;}
.dbtn:hover{opacity:.85;transform:translateY(-1px);}
.dbtn.active{opacity:1;transform:none;box-shadow:0 2px 6px rgba(0,0,0,.15);}

.dbtn-full{background:var(--blue-l);color:var(--blue-d);border-color:#b8d0f0;}
.dbtn-full.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.dbtn-tag{background:var(--green-l);color:#1a7a38;border-color:#a8d8b8;}
.dbtn-tag.active{background:var(--green);color:#fff;border-color:var(--green);}
.dbtn-nacht{background:var(--purple-l);color:#5522cc;border-color:#c0b0f0;}
.dbtn-nacht.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.dbtn-tag-35{background:var(--teal-l);color:#005588;border-color:#90c8e0;}
.dbtn-tag-35.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.dbtn-nacht-35{background:#eee8fe;color:#4822b8;border-color:#c0aaf4;}
.dbtn-nacht-35.active{background:#4822b8;color:#fff;border-color:#4822b8;}

/* ── SUMMARY ── */
.summary-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.sum-header{padding:16px 22px;border-bottom:1px solid var(--bl);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.sum-title{font-size:1rem;font-weight:700;}
.sum-totals{display:flex;gap:16px;flex-wrap:wrap;}
.sum-kpi{text-align:right;}
.sum-kpi-l{font-size:0.62rem;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;}
.sum-kpi-v{font-size:1.1rem;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}
.sum-kpi-v.hi{color:var(--tx);}
.sum-body{padding:12px 14px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.stbl{width:100%;border-collapse:collapse;font-size:0.72rem;min-width:580px;}
.stbl th{text-align:left;padding:4px 7px;color:var(--mu);font-weight:600;font-size:0.58rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--bl);}
.stbl th.r{text-align:right;}
.stbl td{padding:6px 7px;border-bottom:1px solid var(--bl);vertical-align:middle;}
.stbl td.r{text-align:right;font-variant-numeric:tabular-nums;}
.stbl tr:last-child td{border-bottom:none;}
.stbl tr:hover td{background:var(--s2);}
.stbl .strong{color:var(--blue);font-weight:700;}
.stbl .tfoot td{border-top:2px solid var(--bd);background:var(--blue-l);font-weight:700;color:var(--blue);font-size:0.84rem;}
.stbl .dash{color:#ccc;}
.stbl .teal{color:var(--teal);font-weight:600;}

.type-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;white-space:nowrap;}
.tp-wd{background:var(--blue-l);color:var(--blue-d);}
.tp-fr{background:#e6f5f0;color:#006b52;}
.tp-sa{background:var(--green-l);color:#1a7a38;}
.tp-so{background:var(--orange-l);color:#cc4400;}
.tp-fei{background:var(--purple-l);color:#5522cc;}
.tp-n{background:#eee8fe;color:#4822b8;}
.tp-k{background:var(--yellow-l);color:#7a5200;}
.tp-x{background:var(--teal-l);color:#005588;}

.pay-note{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:0.74rem;color:var(--green);background:var(--green-l);border:1px solid #b0ddb8;border-radius:var(--rs);padding:9px 14px;}
.empty-state{text-align:center;padding:48px 20px;color:var(--mu);}
.empty-state .ei{font-size:2.5rem;margin-bottom:10px;}
.empty-state p{font-size:0.85rem;}

/* ── MOBILE ── */
@media(max-width:600px){
  body{font-size:14px;}
  .sum-body{padding:8px 6px 14px;}
  .stbl{font-size:0.63rem;min-width:480px;}
  .stbl th{padding:3px 5px;font-size:0.52rem;}
  .stbl td{padding:5px 5px;}
  .type-pill{font-size:0.58rem;padding:1px 5px;}
  .main{padding:16px 10px 60px;}
  .topbar{padding:10px 14px;}
  .app-title{font-size:1rem;}
  .year-total-pill{font-size:0.72rem;padding:6px 12px;}

  .params-row{gap:6px;}
  .ppill{padding:5px 10px;}
  .ppill select,.ppill input{font-size:0.72rem;}
  .ppill input{width:74px;}

  .month-nav{gap:6px;margin-bottom:14px;}
  .mpill{font-size:0.65rem;padding:5px 8px;}

  .days-header{padding:6px 6px 4px;gap:1px;}
  .dh{font-size:0.6rem;padding:2px;}
  .days-grid{padding:0 6px 8px;gap:2px;}

  .dc{min-height:58px;padding:4px 3px;border-radius:7px;gap:2px;}
  .dnum{font-size:0.68rem;}
  .dtag{font-size:0.38rem;}
  .dbtn{font-size:0.55rem;padding:3px 2px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .cal-header{padding:12px 12px 10px;flex-direction:column;align-items:flex-start;gap:8px;}
  .cal-month-name{font-size:1.1rem;}
  .cal-stats{gap:8px;}
  .cal-stat{font-size:0.66rem;}

  .sum-header{padding:12px 12px;}
  .sum-body{padding:10px 8px 16px;}
  .stbl{font-size:0.68rem;min-width:560px;}
  .stbl th{padding:4px 6px;font-size:0.56rem;}
  .stbl td{padding:6px 7px;}
}
</style>
